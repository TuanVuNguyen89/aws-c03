name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quiz-portal:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/quiz-portal:${{ github.sha }}


  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          cd ~/vunt
          docker compose pull
          docker compose up -d
          docker image prune -f